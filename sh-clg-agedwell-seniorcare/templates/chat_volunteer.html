{% include 'admin_header.html' %}
<br><br><br>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="chat-container card shadow-lg border-0">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Live Chat</h5>
                    <i class="bi bi-chat-square-text fs-4"></i> <!-- Chat icon -->
                </div>
                <div class="card-body p-4" style="height: 400px; overflow-y: auto; background-color: #f0f2f5;">
                    <div class="chat-box">
                        {% for row in data['msg'] %}
                            {% if row['sender_id'] == session['lid'] %}
                                <!-- Message sent by logged-in user/shop -->
                                <div class="d-flex justify-content-end mb-3">
                                    <div class="message-sent speech-bubble bg-primary text-white p-2 rounded">
                                        {{ row['message'] }}
                                        <small class="d-block text-end text-white-50 mt-1">You</small>
                                    </div>
                                </div>
                            {% else %}
                                <!-- Message received by logged-in user/shop -->
                                <div class="d-flex justify-content-start mb-3">
                                    <div class="message-received speech-bubble bg-white text-dark p-2 rounded shadow-sm">
                                        {{ row['message'] }}
                                        <small class="d-block text-start text-muted mt-1">User</small>
                                    </div>
                                </div>
                            {% endif %}
                        {% endfor %}
                    </div>
                </div>
                <div class="card-footer p-3 bg-light">
                    <form method="post" class="d-flex">
                        <input type="text" class="form-control me-2 border-0" name="msg" placeholder="Type your message..." required>
                        <button type="submit" name="submit" class="btn btn-success d-flex align-items-center">
                            <i class="bi bi-send me-1"></i> Send
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% include 'footer.html' %}
